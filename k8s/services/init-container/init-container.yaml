---
# Init Container Job - Run once to seed data
apiVersion: batch/v1
kind: Job
metadata:
  name: bookmyevent-init
  namespace: bookmyevent
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: bookmyevent-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-container
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/bookmyevent/init-container:latest
          env:
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bookmyevent-config
                  key: USER_SERVICE_URL
            - name: EVENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bookmyevent-config
                  key: EVENT_SERVICE_URL
            - name: SEARCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bookmyevent-config
                  key: SEARCH_SERVICE_URL
            - name: BOOKING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bookmyevent-config
                  key: BOOKING_SERVICE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
# Init Container Job Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: init-container-network-policy
  namespace: bookmyevent
spec:
  podSelector:
    matchLabels:
      app: bookmyevent-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: user-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: event-service
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app: search-service
      ports:
        - protocol: TCP
          port: 8003
    - to:
        - podSelector:
            matchLabels:
              app: booking-service
      ports:
        - protocol: TCP
          port: 8004
