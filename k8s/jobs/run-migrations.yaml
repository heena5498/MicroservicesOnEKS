apiVersion: batch/v1
kind: Job
metadata:
  name: run-migrations
  namespace: bookmyevent
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: run-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: pressly/goose:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Running User Service migrations..."
              cd /migrations/user-service
              goose postgres "postgresql://postgres:postgres@postgres:5432/users_db?sslmode=disable" up
              
              echo "Running Event Service migrations..."
              cd /migrations/event-service
              goose postgres "postgresql://postgres:postgres@postgres:5432/events_db?sslmode=disable" up
              
              echo "Running Booking Service migrations..."
              cd /migrations/booking-service
              goose postgres "postgresql://postgres:postgres@postgres:5432/bookings_db?sslmode=disable" up
              
              echo "All migrations completed!"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: migrations
          configMap:
            name: migrations-files



