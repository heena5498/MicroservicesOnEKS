---
# Database Migration Job - Run migrations for all services
apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrations
  namespace: bookmyevent
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: database-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: gomicro/goose:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Running User Service migrations..."
              goose -dir /migrations/user-service postgres "$USER_SERVICE_DB_URL" up
              
              echo "Running Event Service migrations..."
              goose -dir /migrations/event-service postgres "$EVENT_SERVICE_DB_URL" up
              
              echo "Running Booking Service migrations..."
              goose -dir /migrations/booking-service postgres "$BOOKING_SERVICE_DB_URL" up
              
              echo "All migrations completed!"
          env:
            - name: USER_SERVICE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: USER_SERVICE_DB_URL
            - name: EVENT_SERVICE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: EVENT_SERVICE_DB_URL
            - name: BOOKING_SERVICE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: BOOKING_SERVICE_DB_URL
          volumeMounts:
            - name: migrations-volume
              mountPath: /migrations
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: migrations-volume
          configMap:
            name: migrations-config
---
# ConfigMap containing all migration SQL files
apiVersion: v1
kind: ConfigMap
metadata:
  name: migrations-config
  namespace: bookmyevent
data:
  # User Service Migrations
  user-service/00001_create_users_table.sql: |
    -- +goose Up
    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        first_name VARCHAR(100),
        last_name VARCHAR(100),
        phone VARCHAR(20),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- +goose Down
    DROP TABLE IF EXISTS users;

  user-service/00002_create_refresh_tokens_table.sql: |
    -- +goose Up
    CREATE TABLE IF NOT EXISTS refresh_tokens (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        token VARCHAR(255) UNIQUE NOT NULL,
        expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- +goose Down
    DROP TABLE IF EXISTS refresh_tokens;

  user-service/00003_add_user_indexes.sql: |
    -- +goose Up
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_user_id ON refresh_tokens(user_id);
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_token ON refresh_tokens(token);

    -- +goose Down
    DROP INDEX IF EXISTS idx_users_email;
    DROP INDEX IF EXISTS idx_refresh_tokens_user_id;
    DROP INDEX IF EXISTS idx_refresh_tokens_token;



