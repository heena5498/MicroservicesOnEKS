---
# By default, deny all ingress and egress traffic
# This policy stops pods in the bookmyevent namespace from communicating freely (the default behavior) unless explicitly
# allowed by other network policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: bookmyevent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow all egress traffic to the kube-system namespace
# (e.g., for DNS resolution and other cluster services)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-system
  namespace: bookmyevent
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
---
# Allow all ingress traffic from the monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: bookmyevent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
