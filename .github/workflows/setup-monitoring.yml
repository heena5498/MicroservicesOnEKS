name: Setup Monitoring Stack

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Namespace for monitoring stack'
        required: false
        default: 'monitoring'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  MONITORING_NAMESPACE: ${{ inputs.namespace || 'monitoring' }}

jobs:
  deploy-monitoring:
    name: Deploy Prometheus & Grafana Stack
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"
          kubectl cluster-info

      - name: Create monitoring namespace
        run: |
          kubectl create namespace $MONITORING_NAMESPACE 2>/dev/null || \
          echo "Namespace $MONITORING_NAMESPACE already exists"

      - name: Add Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Cleanup existing Prometheus release (if any)
        run: |
          echo "Checking for existing 'prometheus' release across all namespaces..."
          helm list --all-namespaces | grep prometheus || echo "No prometheus release found"

          # Try to uninstall from monitoring namespace
          helm uninstall prometheus -n $MONITORING_NAMESPACE 2>/dev/null || echo "No release in $MONITORING_NAMESPACE"

          # Try to uninstall from default namespace (common mistake)
          helm uninstall prometheus -n default 2>/dev/null || echo "No release in default namespace"

          # Wait for cleanup
          sleep 5

      - name: Deploy Prometheus Stack
        run: |
          # Set Grafana password (use secret or default)
          GRAFANA_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          if [ -z "$GRAFANA_PASSWORD" ]; then
            GRAFANA_PASSWORD="admin"
            echo "Using default Grafana password. Set GRAFANA_ADMIN_PASSWORD secret for production."
          fi
          
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace $MONITORING_NAMESPACE \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.retention=7d \
            --set grafana.adminPassword="${GRAFANA_PASSWORD}" \
            --set grafana.service.type=LoadBalancer \
            --set prometheus.service.type=LoadBalancer \
            --set alertmanager.service.type=LoadBalancer \
            --timeout 15m \
            --wait

      - name: Create custom alert rules
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: bookmyevent-alert-rules
            namespace: $MONITORING_NAMESPACE
            labels:
              app: kube-prometheus-stack
          data:
            bookmyevent-alerts.yaml: |
              groups:
              - name: bookmyevent-alerts
                interval: 30s
                rules:
                # Pod restart alert
                - alert: PodRestartTooHigh
                  expr: increase(kube_pod_container_status_restarts_total{namespace="bookmyevent"}[5m]) > 3
                  for: 1m
                  labels:
                    severity: critical
                    namespace: bookmyevent
                  annotations:
                    summary: "Pod {{ \$labels.pod }} restarting frequently"
                    description: "Pod {{ \$labels.pod }} in namespace {{ \$labels.namespace }} has restarted {{ \$value }} times in the last 5 minutes."
                
                # High memory usage
                - alert: HighMemoryUsage
                  expr: |
                    (sum(container_memory_working_set_bytes{namespace="bookmyevent"}) by (pod) 
                    / sum(container_spec_memory_limit_bytes{namespace="bookmyevent"}) by (pod)) > 0.9
                  for: 2m
                  labels:
                    severity: warning
                    namespace: bookmyevent
                  annotations:
                    summary: "Pod {{ \$labels.pod }} high memory usage"
                    description: "Pod {{ \$labels.pod }} is using more than 90% of its memory limit."
                
                # High CPU usage
                - alert: HighCPUUsage
                  expr: |
                    (sum(rate(container_cpu_usage_seconds_total{namespace="bookmyevent"}[5m])) by (pod)
                    / sum(container_spec_cpu_quota{namespace="bookmyevent"}/container_spec_cpu_period{namespace="bookmyevent"}) by (pod)) > 0.9
                  for: 5m
                  labels:
                    severity: warning
                    namespace: bookmyevent
                  annotations:
                    summary: "Pod {{ \$labels.pod }} high CPU usage"
                    description: "Pod {{ \$labels.pod }} is using more than 90% of its CPU limit for 5 minutes."
                
                # Pod not ready
                - alert: PodNotReady
                  expr: kube_pod_status_phase{namespace="bookmyevent", phase!="Running"} == 1
                  for: 5m
                  labels:
                    severity: warning
                    namespace: bookmyevent
                  annotations:
                    summary: "Pod {{ \$labels.pod }} not ready"
                    description: "Pod {{ \$labels.pod }} in namespace {{ \$labels.namespace }} has been in {{ \$labels.phase }} state for more than 5 minutes."
                
                # Deployment replica mismatch
                - alert: DeploymentReplicaMismatch
                  expr: |
                    kube_deployment_spec_replicas{namespace="bookmyevent"}
                    != kube_deployment_status_replicas_available{namespace="bookmyevent"}
                  for: 10m
                  labels:
                    severity: warning
                    namespace: bookmyevent
                  annotations:
                    summary: "Deployment {{ \$labels.deployment }} replica mismatch"
                    description: "Deployment {{ \$labels.deployment }} has {{ \$value }} replicas available but should have {{ \$labels.spec_replicas }}."
          EOF

      - name: Wait for monitoring stack to be ready
        run: |
          echo "Waiting for Prometheus pods..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=prometheus \
            -n $MONITORING_NAMESPACE \
            --timeout=600s
          
          echo "Waiting for Grafana pods..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=grafana \
            -n $MONITORING_NAMESPACE \
            --timeout=600s
          
          echo "Waiting for Alertmanager pods..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=alertmanager \
            -n $MONITORING_NAMESPACE \
            --timeout=600s

      - name: Get access information
        run: |
          echo "=== Monitoring Stack Deployed ==="
          echo ""
          echo "Getting LoadBalancer URLs (may take a few minutes)..."
          
          # Wait for LoadBalancers to be assigned
          for i in {1..30}; do
            GRAFANA_URL=$(kubectl get svc prometheus-grafana -n $MONITORING_NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            PROMETHEUS_URL=$(kubectl get svc prometheus-kube-prometheus-prometheus -n $MONITORING_NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            ALERTMANAGER_URL=$(kubectl get svc prometheus-kube-prometheus-alertmanager -n $MONITORING_NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            
            if [ -n "$GRAFANA_URL" ] && [ -n "$PROMETHEUS_URL" ] && [ -n "$ALERTMANAGER_URL" ]; then
              echo "All LoadBalancers ready!"
              echo ""
              echo "Grafana: http://${GRAFANA_URL}"
              echo "  Username: admin"
              echo "  Password: (check GRAFANA_ADMIN_PASSWORD secret or default 'admin')" 
              echo ""
              echo "Prometheus: http://${PROMETHEUS_URL}:9090"
              echo "Alertmanager: http://${ALERTMANAGER_URL}:9093"
              break
            fi
            echo "Waiting for LoadBalancers... ($i/30)"
            sleep 10
          done
          
          echo ""
          echo "=== All Services ==="
          kubectl get svc -n $MONITORING_NAMESPACE
          
          echo ""
          echo "=== All Pods ==="
          kubectl get pods -n $MONITORING_NAMESPACE

      - name: Create deployment summary
        if: always()
        run: |
          echo "## Monitoring Stack Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Components Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana" >> $GITHUB_STEP_SUMMARY
          echo "- Alertmanager" >> $GITHUB_STEP_SUMMARY
          echo "- Custom Alert Rules for BookMyEvent" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access Information" >> $GITHUB_STEP_SUMMARY
          echo "Run these commands to get access URLs:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "kubectl get svc -n $MONITORING_NAMESPACE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Port Forward (Alternative)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Grafana" >> $GITHUB_STEP_SUMMARY
          echo "kubectl port-forward -n $MONITORING_NAMESPACE svc/prometheus-grafana 3000:80" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Prometheus" >> $GITHUB_STEP_SUMMARY
          echo "kubectl port-forward -n $MONITORING_NAMESPACE svc/prometheus-kube-prometheus-prometheus 9090:9090" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Alertmanager" >> $GITHUB_STEP_SUMMARY
          echo "kubectl port-forward -n $MONITORING_NAMESPACE svc/prometheus-kube-prometheus-alertmanager 9093:9093" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY