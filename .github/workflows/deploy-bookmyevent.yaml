name: Deploy BookMyEvent to EKS

on:
  push:
    branches: [ main, build ]
  pull_request:
    branches: [ main, build ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: bookmyevent

jobs:
  # ============================
  # 1) Build and Test
  # ============================
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, event-service, search-service, booking-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests for ${{ matrix.service }}
        run: |
          # Test main package
          if [ -d "cmd/${{ matrix.service }}" ]; then
            echo "Testing cmd/${{ matrix.service }}..."
            cd cmd/${{ matrix.service }}
            go test -v -race -coverprofile=coverage.out ./... || echo "No tests in cmd"
            cd ../..
          fi
          
          # Test service package (where business logic lives)
          if [ -d "services/$(echo ${{ matrix.service }} | sed 's/-service$//')" ]; then
            echo "Testing services/$(echo ${{ matrix.service }} | sed 's/-service$//')..."
            cd services/$(echo ${{ matrix.service }} | sed 's/-service$//')
            go test -v -race -coverprofile=coverage.out ./... || echo "No tests in services"
            cd ../..
          fi
        continue-on-error: false  # Fail build if tests fail (once tests are written)

      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: cmd/${{ matrix.service }}
          severity: CRITICAL,HIGH
        continue-on-error: true

  # ============================
  # 2) Build and Push Images
  # ============================
  build-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        service:
          - name: user-service
            context: .
            dockerfile: k8s/services/user-service/Dockerfile
          - name: event-service
            context: .
            dockerfile: k8s/services/event-service/Dockerfile
          - name: search-service
            context: .
            dockerfile: k8s/services/search-service/Dockerfile
          - name: booking-service
            context: .
            dockerfile: k8s/services/booking-service/Dockerfile
          - name: frontend
            context: .
            dockerfile: k8s/services/frontend/Dockerfile
          - name: init-container
            context: .
            dockerfile: k8s/services/init-container/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image for ${{ matrix.service.name }}
        id: build
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE_URI="${ECR_REGISTRY}/bookmyevent/${{ matrix.service.name }}:${IMAGE_TAG}"
          IMAGE_LATEST="${ECR_REGISTRY}/bookmyevent/${{ matrix.service.name }}:latest"

          echo "Building ${{ matrix.service.name }}..."
          docker build -t "$IMAGE_URI" -t "$IMAGE_LATEST" \
            -f ${{ matrix.service.dockerfile }} \
            ${{ matrix.service.context }}

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "image_latest=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "Built ${{ matrix.service.name }}: $IMAGE_URI"

      - name: Run Trivy vulnerability scanner on ${{ matrix.service.name }} (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image_uri }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'   # Don't fail build, just report
        continue-on-error: true

        # Upload Trivy SARIF to GitHub Security tab
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (table output, block on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image_uri }}
          format: table
          severity: CRITICAL
          exit-code: '1'  # Fail if CRITICAL vulnerabilities found
        continue-on-error: false

      - name: Push images to ECR
        if: success()
        run: |
          echo "Pushing ${{ matrix.service.name }} images..."
          docker push "${{ steps.build.outputs.image_uri }}"
          docker push "${{ steps.build.outputs.image_latest }}"
          echo "Pushed ${{ matrix.service.name }}: ${{ steps.build.outputs.image_uri }}"

      - name: Output image details
        run: |
          echo "${{ matrix.service.name }}_IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

          echo "### ${{ matrix.service.name }} Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.build.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Latest: \`${{ steps.build.outputs.image_latest }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================
  # 3) Deploy to EKS using Helm + RDS
  # ============================
  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"
          kubectl cluster-info

      - name: Get ECR Registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      - name: Deploy with Helm (using RDS)
        id: helm-deploy
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          # Ensure namespace exists
          if ! kubectl get namespace "$K8S_NAMESPACE" >/dev/null 2>&1; then
            echo "Creating namespace $K8S_NAMESPACE..."
            kubectl create namespace "$K8S_NAMESPACE"
          fi

          # Add Helm labels/annotations to namespace
          echo "Adding Helm labels/annotations to namespace..."
          kubectl label namespace "$K8S_NAMESPACE" app.kubernetes.io/managed-by=Helm --overwrite
          kubectl annotate namespace "$K8S_NAMESPACE" meta.helm.sh/release-name=bookmyevent --overwrite
          kubectl annotate namespace "$K8S_NAMESPACE" meta.helm.sh/release-namespace="$K8S_NAMESPACE" --overwrite

          # Create RDS secrets BEFORE Helm deployment so pods can find them
          echo "Creating RDS secrets from GitHub Secrets..."
          
          # URL-encode RDS password for connection strings
          RDS_PASSWORD_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ secrets.RDS_PASSWORD }}', safe=''))")
          
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: bookmyevent-secrets
            namespace: $K8S_NAMESPACE
          type: Opaque
          stringData:
            POSTGRES_USER: "postgres"
            POSTGRES_PASSWORD: "${{ secrets.RDS_PASSWORD }}"
            USER_SERVICE_DB_URL: "postgresql://postgres:${RDS_PASSWORD_ENCODED}@${{ secrets.RDS_ENDPOINT }}:5432/users_db?sslmode=require"
            EVENT_SERVICE_DB_URL: "postgresql://postgres:${RDS_PASSWORD_ENCODED}@${{ secrets.RDS_ENDPOINT }}:5432/events_db?sslmode=require"
            BOOKING_SERVICE_DB_URL: "postgresql://postgres:${RDS_PASSWORD_ENCODED}@${{ secrets.RDS_ENDPOINT }}:5432/bookings_db?sslmode=require"
            JWT_SECRET: "${{ secrets.JWT_SECRET }}"
            INTERNAL_API_KEY: "${{ secrets.INTERNAL_API_KEY }}"
          EOF

          # Check for stuck Helm release (pending-*) and clean it up
          echo "Checking existing Helm release status..."
          HELM_STATUS=$(helm status bookmyevent -n "$K8S_NAMESPACE" -o json 2>/dev/null | jq -r '.info.status' || echo "none")
          echo "Current Helm status: $HELM_STATUS"

          if [ "$HELM_STATUS" = "pending-upgrade" ] || \
             [ "$HELM_STATUS" = "pending-install" ] || \
             [ "$HELM_STATUS" = "pending-rollback" ]; then
            echo "Helm release is stuck in status '$HELM_STATUS'. Cleaning up with helm uninstall..."
            helm uninstall bookmyevent -n "$K8S_NAMESPACE" || true
          fi

          # Save current revision for info / optional rollback logic
          CURRENT_REVISION=$(helm list -n "$K8S_NAMESPACE" -o json | jq -r '.[] | select(.name=="bookmyevent") | .revision' 2>/dev/null || echo "0")
          echo "current_revision=$CURRENT_REVISION" >> $GITHUB_OUTPUT
          echo "Current Helm revision: $CURRENT_REVISION"

          # Deploy with Helm (Postgres disabled for RDS)
          echo "Deploying with Helm (RDS mode - postgres disabled)..."
          helm upgrade --install bookmyevent ./helm \
            --namespace "$K8S_NAMESPACE" \
            --set global.imageRegistry="${ECR_REGISTRY}/bookmyevent" \
            --set imageTags.userService="${IMAGE_TAG}" \
            --set imageTags.eventService="${IMAGE_TAG}" \
            --set imageTags.searchService="${IMAGE_TAG}" \
            --set imageTags.bookingService="${IMAGE_TAG}" \
            --set imageTags.frontend="${IMAGE_TAG}" \
            --set imageTags.initContainer="${IMAGE_TAG}" \
            --set database.postgres.enabled=false \
            --set secrets.create=false \
            --timeout 15m \
            --atomic \
            --wait

          NEW_REVISION=$(helm list -n "$K8S_NAMESPACE" -o json | jq -r '.[] | select(.name=="bookmyevent") | .revision')
          echo "new_revision=$NEW_REVISION" >> $GITHUB_OUTPUT
          echo "Helm deployment completed - Revision: $NEW_REVISION"

          # Wait for infra pods (Redis, Elasticsearch)
          echo "Waiting for infrastructure pods (Redis, Elasticsearch)..."
          kubectl wait --for=condition=ready pod -l app=redis -n "$K8S_NAMESPACE" --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=elasticsearch -n "$K8S_NAMESPACE" --timeout=300s || true

          # Run RDS migrations using a Kubernetes Job
          echo "Running RDS migrations against RDS endpoint: ${{ secrets.RDS_ENDPOINT }}..."
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: run-migrations-rds-${GITHUB_SHA::7}
            namespace: $K8S_NAMESPACE
          spec:
            ttlSecondsAfterFinished: 600
            backoffLimit: 3
            template:
              metadata:
                labels:
                  app: run-migrations-rds
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: migrations
                    image: postgres:15-alpine
                    env:
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: bookmyevent-secrets
                            key: POSTGRES_PASSWORD
                      - name: RDS_ENDPOINT
                        value: "${{ secrets.RDS_ENDPOINT }}"
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -e
                        echo "Testing connection to RDS endpoint: ${RDS_ENDPOINT}..."
                        psql "host=${RDS_ENDPOINT} port=5432 user=postgres dbname=postgres sslmode=require" -c "SELECT version();"
                        
                        echo "Creating databases on RDS if they don't exist..."
                        psql "host=${RDS_ENDPOINT} port=5432 user=postgres dbname=postgres sslmode=require" <<'SQL'
                        SELECT 'CREATE DATABASE users_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'users_db')\gexec
                        SELECT 'CREATE DATABASE events_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'events_db')\gexec
                        SELECT 'CREATE DATABASE bookings_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'bookings_db')\gexec
                        SQL
                        
                        echo "Verifying databases were created..."
                        psql "host=${RDS_ENDPOINT} port=5432 user=postgres dbname=postgres sslmode=require" -c "\l"
                        echo "Database creation completed successfully"
          EOF

          echo "Waiting for migrations Job to complete..."
          kubectl wait --for=condition=complete job/run-migrations-rds-${GITHUB_SHA::7} -n "$K8S_NAMESPACE" --timeout=120s || {
            echo "Migration job did not complete in time, checking status..."
            kubectl describe job/run-migrations-rds-${GITHUB_SHA::7} -n "$K8S_NAMESPACE"
            kubectl logs job/run-migrations-rds-${GITHUB_SHA::7} -n "$K8S_NAMESPACE" || echo "No logs available"
            exit 1
          }

      - name: Wait for application pods
        run: |
          echo "Waiting for BookMyEvent application pods to become ready..."
          kubectl wait --for=condition=ready pod -l app=user-service -n "$K8S_NAMESPACE" --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=event-service -n "$K8S_NAMESPACE" --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=booking-service -n "$K8S_NAMESPACE" --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=search-service -n "$K8S_NAMESPACE" --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=frontend -n "$K8S_NAMESPACE" --timeout=300s || true

      - name: Get ALB URL and summary
        id: lb-url
        run: |
          echo "Fetching ALB Ingress URL..."
          LB_URL=$(kubectl get ingress bookmyevent-ingress -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ALB URL: http://${LB_URL}"
          echo "lb_url=$LB_URL" >> $GITHUB_OUTPUT

          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`$K8S_NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- EKS Cluster: \`$EKS_CLUSTER_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- RDS Endpoint: \`${{ secrets.RDS_ENDPOINT }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend URL (ALB): \`http://${LB_URL}\`" >> $GITHUB_STEP_SUMMARY

  # ============================
  # 4) Integration Tests
  # ============================
  integration-tests:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests pytest python-dotenv colorama

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Get ALB URL
        id: get-lb
        run: |
          LB_URL=$(kubectl get ingress bookmyevent-ingress -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "API_BASE_URL=http://${LB_URL}" >> $GITHUB_ENV
          echo "ALB URL: http://${LB_URL}"
          
          # Create test environment config
          cat > scripts/testing/test-env.config <<EOF
          # Generated test configuration for CI/CD
          USER_SERVICE_URL=http://${LB_URL}/api/user
          EVENT_SERVICE_URL=http://${LB_URL}/api/event
          SEARCH_SERVICE_URL=http://${LB_URL}/api/search
          BOOKING_SERVICE_URL=http://${LB_URL}/api/booking
          API_BASE_URL=http://${LB_URL}
          EOF

      - name: Run API endpoint tests
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          chmod +x tests-scripts/test-endpoints.sh
          echo "Testing against: $API_BASE_URL"
          ./tests-scripts/test-endpoints.sh
        continue-on-error: true

      - name: Run booking service tests
        run: |
          chmod +x tests-scripts/test_booking_flow.py
          python tests-scripts/test_booking_flow.py
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        continue-on-error: true

      - name: Run search service tests
        run: |
          chmod +x tests-scripts/comprehensive_search_api_test.py
          python tests-scripts/comprehensive_search_api_test.py
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        continue-on-error: true

      - name: Integration Test Summary
        if: always()
        run: |
          echo "### Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- API Base URL: \`$API_BASE_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tests executed: Endpoint validation, Booking flow, Search API" >> $GITHUB_STEP_SUMMARY
